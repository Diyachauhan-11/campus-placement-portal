<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CampusBridge | Enterprise Placement Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(18, 24, 38, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Glowing Background Orbs -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass-card w-full max-w-md rounded-2xl p-8 shadow-2xl relative z-10 border border-slate-800">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 items-center justify-center font-black text-white text-lg tracking-wider shadow-lg shadow-indigo-500/30 mb-3">
        CB
      </div>
      <h1 class="text-2xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">CampusBridge</h1>
      <p id="auth-subtitle" class="text-xs text-slate-400 mt-1">Bridging Academia to Corporate Careers</p>
    </div>

    <!-- Form Section -->
    <form id="auth-form" class="space-y-4">
      <div id="name-group">
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Full Name</label>
        <input type="text" id="name" placeholder="Diya Chauhan" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">College Email</label>
        <input type="email" id="email" required placeholder="student@college.edu" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div id="student-academic-fields" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Engineering Branch</label>
          <select id="branch" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="CSE">Computer Science (CSE)</option>
            <option value="IT">Information Technology (IT)</option>
            <option value="ECE">Electronics & Comm (ECE)</option>
            <option value="EE">Electrical Engineering (EE)</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Current CGPA</label>
            <input type="number" id="cgpa" step="0.01" min="0" max="10" placeholder="8.50" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">Active Backlogs</label>
            <input type="number" id="backlogs" min="0" value="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>
      </div>

      <button type="submit" id="submit-btn" class="w-full mt-2 py-3 px-4 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white shadow-lg shadow-indigo-500/25 transition duration-200">
        Register Candidate Profile
      </button>
    </form>

    <!-- Switcher -->
    <div class="text-center mt-6 pt-5 border-t border-slate-800">
      <p class="text-xs text-slate-400">
        <span id="toggle-msg">Already have an account?</span> 
        <a href="#" id="toggle-auth" class="text-indigo-400 font-semibold hover:text-indigo-300 ml-1">Sign In</a>
      </p>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
